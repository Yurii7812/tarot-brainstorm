<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タロット・ブレインストーミング</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <input id="title" placeholder="質問・テーマ（例: 相手との関係をどうするか）" aria-label="質問・テーマ">
  <select id="spread" aria-label="スプレッド"></select>
  <select id="history" aria-label="保存した読み"></select>
  <button id="btn-new" type="button">新規</button>
  <button id="btn-del" type="button">削除</button>
  <button id="btn-md" type="button">.md を出力</button>
  <button id="btn-png" type="button">画像を出力</button>
</header>
<main>
  <section id="board-wrap"><div id="board"></div></section>
  <aside id="panel"></aside>
</main>
<section id="below">
  <div id="links"></div>
  <div id="summary-wrap">
    <h3>まとめ</h3>
    <textarea id="summary" rows="5" placeholder="全体としての結論・次にやること"></textarea>
  </div>
</section>
<script src="cards.js"></script>
<script src="spreads.js"></script>
<script src="app.js"></script>
</body>
</html>
